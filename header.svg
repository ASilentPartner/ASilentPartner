        <polyline points="1,3 8,8 15,3" fill="none" stroke="#6b7280" stroke-width="1.5" />
        <text x="24" y="12" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5px">asp@eventdeparture.com</text>
