<svg fill="none" viewBox="0 0 850 180" width="850" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          height: 178px;
          padding: 0 48px;
          box-sizing: border-box;
          background: #fafafa;
          border: 1px solid #e5e5e5;
          border-radius: 12px;
        }

        .badges-grid {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .badges-row {
          display: flex;
          gap: 8px;
        }

        .badge {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: #171717;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #ffffff;
          font-size: 14px;
          font-weight: 700;
          user-select: none;
        }

        .badge svg {
          width: 17px;
          height: 17px;
          fill: #ffffff;
        }

        .brand-section {
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 8px;
        }

        .title {
          font-size: 24px;
          font-weight: 800;
          letter-spacing: 0.08em;
          color: #171717;
        }

        .title span {
          color: #a3a3a3;
          font-weight: 400;
        }

        .email-link {
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 13px;
          color: #525252;
          background: #f5f5f5;
          border: 1px solid #e5e5e5;
          padding: 4px 10px;
          border-radius: 6px;
          text-decoration: none;
        }
      </style>

      <div class="container">
        <!-- Minimal Flat Badges -->
        <div class="badges-grid">
          <div class="badges-row">
            <div class="badge">A</div>
            <div class="badge">S</div>
            <div class="badge">P</div>
            <div class="badge">
              <svg viewBox="0 0 24 24">
